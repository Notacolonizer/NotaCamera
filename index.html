<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Not a Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="camera">

        <video
            id="cameraPreview"
            autoplay
            playsinline
            muted>
        </video>

        <div id="focusIndicator"></div>

        <!-- Top controls -->
        <div class="top-controls">

            <button class="glass-button" id="flashButton">
                ⚡
            </button>

            <button class="zoom-indicator" id="zoomButton">
                1×
            </button>

            <button class="glass-button" id="cameraButton">
                ↻
            </button>

        </div>


        <!-- Bottom controls -->
        <div class="bottom-controls">

            <button class="side-button" id="galleryButton">
                <span>□</span>
            </button>


            <button
                class="shutter-button"
                id="shutterButton"
                aria-label="Take photo">
            </button>


            <button class="side-button" id="cameraModeButton">
                <span>↻</span>
            </button>

        </div>

    </main>


    <canvas id="photoCanvas"></canvas>


    <script src="app.js"></script>

</body>
</html>
