
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#000000">

    <title>Not A Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="camera">

    <!-- CAMERA PREVIEW -->

    <video
        id="cameraPreview"
        autoplay
        playsinline
        muted
    ></video>

    <div id="focusIndicator"></div>

    <!-- TOP BAR -->

    <div class="top-bar">

        <button
            class="glass-button"
            id="flashButton"
            aria-label="Flash"
        >
            ⚡
        </button>

        <button
            class="glass-button zoom-button"
            id="zoomButton"
        >
            1×
        </button>

        <button
            class="glass-button"
            id="cameraButton"
            aria-label="Switch camera"
        >
            ↻
        </button>

    </div>


    <!-- CAMERA STATUS -->

    <div class="camera-status" id="cameraStatus">
        Ready
    </div>


    <!-- STYLE NAME -->

    <div class="current-style" id="currentStyle">
        ORIGINAL
    </div>


    <!-- BOTTOM CAMERA CONTROLS -->

    <div class="camera-controls">

        <button
            class="gallery-button"
            id="galleryButton"
            aria-label="Gallery"
        >
            <span></span>
        </button>


        <button
            class="shutter-button"
            id="shutterButton"
            aria-label="Take photo"
        >
            <span></span>
        </button>


        <button
            class="camera-mode-button"
            id="cameraModeButton"
            aria-label="Switch camera"
        >
            ↻
        </button>

    </div>


    <!-- STYLE BUTTON -->

    <button
        class="styles-button"
        id="stylesButton"
    >
        <span>✦</span>
        <span>LOOK</span>
    </button>


    <!-- =================================================
         CAMERA CUSTOMIZER
    ================================================= -->

    <section
        class="style-panel"
        id="stylePanel"
    >

        <div class="panel-handle"></div>

        <div class="panel-header">

            <div>
                <div class="eyebrow">
                    CAMERA LAB
                </div>

                <h2>Customize</h2>
            </div>

            <button
                class="close-button"
                id="closeStyles"
            >
                ×
            </button>

        </div>


        <!-- PRESET LOOKS -->

        <div class="section-title">
            CAMERA LOOKS
        </div>

        <div class="style-scroll">

            <button
                class="style-option active"
                data-style="original"
            >
                <div class="style-preview original-preview"></div>
                <span>Original</span>
            </button>


            <button
                class="style-option"
                data-style="film"
            >
                <div class="style-preview film-preview"></div>
                <span>35mm</span>
            </button>


            <button
                class="style-option"
                data-style="vintage"
            >
                <div class="style-preview vintage-preview"></div>
                <span>Vintage</span>
            </button>


            <button
                class="style-option"
                data-style="disposable"
            >
                <div class="style-preview disposable-preview"></div>
                <span>Disposable</span>
            </button>


            <button
                class="style-option"
                data-style="digital"
            >
                <div class="style-preview digital-preview"></div>
                <span>Digital</span>
            </button>


            <button
                class="style-option"
                data-style="dreamy"
            >
                <div class="style-preview dreamy-preview"></div>
                <span>Dream</span>
            </button>


            <button
                class="style-option"
                data-style="night"
            >
                <div class="style-preview night-preview"></div>
                <span>Night</span>
            </button>


            <button
                class="style-option"
                data-style="noir"
            >
                <div class="style-preview noir-preview"></div>
                <span>Noir</span>
            </button>

        </div>


        <!-- STRENGTH -->

        <div class="control-row">

            <div>
                <span class="control-label">
                    Look strength
                </span>

                <span
                    class="control-value"
                    id="strengthValue"
                >
                    70
                </span>
            </div>

            <input
                type="range"
                id="strengthSlider"
                min="0"
                max="100"
                value="70"
            >

        </div>


        <!-- CUSTOM CAMERA CONTROLS -->

        <div class="section-title custom-title">
            CUSTOM CAMERA
        </div>


        <div class="custom-grid">

            <div class="custom-control">

                <div class="custom-label">
                    <span>Exposure</span>
                    <span id="exposureValue">0</span>
                </div>

                <input
                    type="range"
                    id="exposureSlider"
                    min="-30"
                    max="30"
                    value="0"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Contrast</span>
                    <span id="contrastValue">100</span>
                </div>

                <input
                    type="range"
                    id="contrastSlider"
                    min="70"
                    max="140"
                    value="100"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Saturation</span>
                    <span id="saturationValue">100</span>
                </div>

                <input
                    type="range"
                    id="saturationSlider"
                    min="0"
                    max="160"
                    value="100"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Warmth</span>
                    <span id="warmthValue">0</span>
                </div>

                <input
                    type="range"
                    id="warmthSlider"
                    min="-30"
                    max="30"
                    value="0"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Grain</span>
                    <span id="grainValue">0</span>
                </div>

                <input
                    type="range"
                    id="grainSlider"
                    min="0"
                    max="60"
                    value="0"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Vignette</span>
                    <span id="vignetteValue">0</span>
                </div>

                <input
                    type="range"
                    id="vignetteSlider"
                    min="0"
                    max="70"
                    value="0"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Dust</span>
                    <span id="dustValue">0</span>
                </div>

                <input
                    type="range"
                    id="dustSlider"
                    min="0"
                    max="40"
                    value="0"
                >

            </div>


            <div class="custom-control">

                <div class="custom-label">
                    <span>Light leak</span>
                    <span id="lightLeakValue">0</span>
                </div>

                <input
                    type="range"
                    id="lightLeakSlider"
                    min="0"
                    max="60"
                    value="0"
                >

            </div>

        </div>


        <!-- DATE STAMP -->

        <label class="toggle-row">

            <span>
                Date stamp
            </span>

            <input
                type="checkbox"
                id="dateStampToggle"
            >

            <span class="toggle-switch"></span>

        </label>


        <!-- RESET -->

        <button
            class="reset-button"
            id="resetCamera"
        >
            Reset camera
        </button>

    </section>


    <!-- =================================================
         GALLERY
    ================================================= -->

    <section
        class="gallery-screen"
        id="galleryScreen"
    >

        <div class="gallery-header">

            <button
                class="gallery-back"
                id="closeGallery"
            >
                ←
            </button>

            <div>
                <div class="eyebrow">
                    YOUR CAMERA
                </div>

                <h2>Photos</h2>
            </div>

            <div class="gallery-count" id="galleryCount">
                0
            </div>

        </div>


        <div
            class="gallery-grid"
            id="galleryGrid"
        ></div>

    </section>


    <!-- =================================================
         PHOTO VIEWER
    ================================================= -->

    <section
        class="photo-viewer"
        id="photoViewer"
    >

        <div class="viewer-top">

            <button
                id="closeViewer"
                class="viewer-button"
            >
                ←
            </button>

            <div class="viewer-title">
                <span id="viewerTitle">
                    Photo
                </span>

                <small id="viewerSubtitle">
                    Camera
                </small>
            </div>

            <button
                id="deletePhoto"
                class="viewer-button"
            >
                🗑
            </button>

        </div>


        <div
            class="viewer-image-container"
            id="viewerImageContainer"
        >

            <button
                class="viewer-arrow left"
                id="previousPhoto"
            >
                ‹
            </button>


            <img
                id="viewerImage"
                alt="Selected photo"
            >


            <button
                class="viewer-arrow right"
                id="nextPhoto"
            >
                ›
            </button>

        </div>


        <div class="viewer-bottom">

            <div
                class="photo-info"
                id="photoInfo"
            ></div>


            <div class="viewer-actions">

                <button
                    id="sharePhoto"
                    class="viewer-action"
                >
                    <strong>↗</strong>
                    <span>Share</span>
                </button>


                <button
                    id="exportPhoto"
                    class="viewer-action"
                >
                    <strong>↓</strong>
                    <span>Export</span>
                </button>

            </div>

        </div>

    </section>


    <!-- CANVAS -->

    <canvas
        id="photoCanvas"
    ></canvas>

</main>


<script src="app.js"></script>

</body>
</html>
