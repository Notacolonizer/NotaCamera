<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Not a Camera</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="camera">

        <video id="cameraPreview"
               autoplay
               playsinline
               muted></video>

        <div class="top-controls">
            <button id="flashButton">⚡</button>
            <button id="switchButton">↻</button>
        </div>

        <div class="bottom-controls">

            <button class="side-button" id="galleryButton">
                □
            </button>

            <button class="shutter-button" id="shutterButton">
            </button>

            <button class="side-button" id="cameraButton">
                ↻
            </button>

        </div>

    </div>

    <canvas id="photoCanvas"></canvas>

    <script src="app.js"></script>

</body>
</html>
